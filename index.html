<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crumb &amp; Co</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#2b211a;background:#fbf6ef}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid #eadfce}header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font:700 22px Georgia,"Times New Roman",serif;letter-spacing:-.01em}nav a{color:#6b5a4b;text-decoration:none;margin-left:24px;font-size:15px}
.hero{padding:72px 0 56px}.hero h1{font:700 52px/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:0;max-width:14ch}
.hero p{font-size:19px;color:#6b5a4b;max-width:44ch;margin:18px 0 0}.hours{display:inline-block;margin-top:24px;padding:6px 12px;border-radius:999px;background:#f1e4d1;color:#7a4b1e;font-size:14px}
#menu{padding:40px 0;border-top:1px solid #eadfce}#menu h2,#order h2{font:700 28px Georgia,"Times New Roman",serif;margin:0 0 20px}
#menu ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
#menu li{background:#fff;border:1px solid #eadfce;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.name{font-weight:600}.price{color:#a0521c;font-variant-numeric:tabular-nums}
#order{padding:40px 0 72px;border-top:1px solid #eadfce}#contact{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px}
input,textarea{font:inherit;padding:10px 12px;border:1px solid #dccdb8;border-radius:8px;background:#fff}textarea{grid-column:1/-1;min-height:96px}
button{grid-column:1/-1;justify-self:start;font:600 15px inherit;font-family:inherit;padding:11px 20px;border:0;border-radius:8px;background:#7a4b1e;color:#fff}
@media(max-width:640px){.hero h1{font-size:38px}#menu ul,#contact{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap"><span class="brand">Crumb &amp; Co</span><nav><a href="#menu">Menu</a><a href="#order">Order ahead</a></nav></div></header>
<main class="wrap">
<section class="hero"><h1>Baked before sunrise, gone by noon.</h1><p>A small neighbourhood bakery. Sourdough, laminated pastry and whatever came out of the oven best this morning.</p><span class="hours">Open Tue–Sun, 7am–2pm</span></section>
<section id="menu"><h2>Menu</h2><ul><li><span class="name">Sourdough loaf</span> <span class="price">$6.50</span></li><li><span class="name">Almond croissant</span> <span class="price">$3.75</span></li><li><span class="name">Cinnamon roll</span> <span class="price">$4.25</span></li></ul></section>
<section id="order"><h2>Order ahead</h2>
<form id="contact" method="post" action="/contact"><!-- static copy: the form needs the app server -->
<input name="name" id="name" placeholder="Your name"><input name="email" id="email" placeholder="Email"><textarea name="message" id="message" placeholder="What would you like, and when will you pick it up?"></textarea>
<button id="send" type="submit">Send order</button></form></section>
</main></body></html>
